services:
  - type: web
    name: panemaji
    runtime: node
    region: singapore
    plan: starter
    disk:
      name: panemaji-data
      mountPath: /data
      sizeGB: 1
    buildCommand: npm install && node scripts/download-db.mjs && npm run build
    startCommand: bash scripts/init-db.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DB_PATH
        value: /data/panemaji.db
      # メモリ抑制 (Render Starter 512MB):
      # - --max-old-space-size=400: V8 heap を 400MB に cap
      # - --expose-gc: memory-watchdog が global.gc() 定期発動して lazy GC 蓄積を予防
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400 --expose-gc"
      - key: UV_THREADPOOL_SIZE
        value: "2"
      # メール配信システム(meiris / mail.merokano.jp)連携。
      # public リポジトリなので値はここに書かない。Render ダッシュボードで設定する。
      - key: MEIRIS_API_KEY
        sync: false
